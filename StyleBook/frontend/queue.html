<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Salon Queue Tracker — Stylora</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/customer.css" />
  <link rel="stylesheet" href="css/owner.css" />
  <link rel="stylesheet" href="css/ai.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <div id="siteHeader"></div>

  <main class="container" style="padding-top:28px;">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;margin-bottom:20px;">
      <div>
        <h1 style="font-family:var(--font-display);font-size:1.8rem;font-weight:800;">Live Salon Queue Display</h1>
        <p style="color:var(--text-muted);">Real-time token status, people waiting, and estimated wait time before or after booking.</p>
      </div>
      <div style="display:flex;align-items:center;gap:10px;">
        <label for="queueBusinessSelect" style="font-weight:600;font-size:0.88rem;">Select Studio:</label>
        <select id="queueBusinessSelect" class="form-control" style="min-width:260px;"></select>
      </div>
    </div>

    <div id="liveQueueMount"></div>
  </main>

  <div id="siteFooter"></div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/common.js"></script>
  <script src="js/queue.js"></script>
</body>
</html>
