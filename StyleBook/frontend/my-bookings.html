<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Bookings — Stylora</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/customer.css" />
  <link rel="stylesheet" href="css/owner.css" />
  <link rel="stylesheet" href="css/ai.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <div id="siteHeader"></div>

  <main class="container" style="padding-top:28px;" id="myBookingsMount">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;margin-bottom:20px;">
      <div>
        <h1 style="font-family:var(--font-display);font-size:1.8rem;font-weight:800;">My Bookings & History</h1>
        <p style="color:var(--text-muted);">View upcoming salon visits, live queue tokens, and rate completed services.</p>
      </div>
      <a href="explore.html" class="btn btn-primary"><i class="fa-solid fa-plus"></i> Book Another Service</a>
    </div>

    <div class="tabs-bar">
      <button type="button" class="tab-btn active" data-status="ALL">All Bookings</button>
      <button type="button" class="tab-btn" data-status="PENDING">Pending</button>
      <button type="button" class="tab-btn" data-status="ACCEPTED">Accepted / In Queue</button>
      <button type="button" class="tab-btn" data-status="SERVING">Serving Now</button>
      <button type="button" class="tab-btn" data-status="COMPLETED">Completed</button>
      <button type="button" class="tab-btn" data-status="CANCELLED">Cancelled</button>
    </div>

    <div id="myBookingsList"></div>
  </main>

  <div id="siteFooter"></div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/common.js"></script>
  <script src="js/customer.js"></script>
</body>
</html>
