<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Salon Working Hours & Queue Settings — Stylora</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/owner.css" />
  <link rel="stylesheet" href="css/ai.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <div id="siteHeader"></div>

  <div class="owner-layout">
    <div id="ownerSidebarMount"></div>
    <main class="owner-main">
      <h1 style="font-family:var(--font-display);font-size:1.75rem;font-weight:800;margin-bottom:6px;">Working Hours, Queue & Operational Settings</h1>
      <p style="color:var(--text-muted);margin-bottom:24px;">Configure your opening hours, open chairs, average service time for queue calculations, and home service availability.</p>

      <div class="card" style="padding:28px;max-width:720px;">
        <form id="ownerBusinessForm">
          <div class="form-group">
            <label class="form-label" for="bizHours">Opening Hours</label>
            <input type="text" id="bizHours" class="form-control" value="09:00 AM - 09:30 PM" required />
          </div>

          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px;">
            <div class="form-group">
              <label class="form-label" for="bizPrice">Starting Price (₹)</label>
              <input type="number" id="bizPrice" class="form-control" value="299" required />
            </div>
            <div class="form-group">
              <label class="form-label" for="bizSeats">Available Chairs</label>
              <input type="number" id="bizSeats" class="form-control" value="3" required />
            </div>
            <div class="form-group">
              <label class="form-label" for="bizAvgTime">Avg. Service Time (Min)</label>
              <input type="number" id="bizAvgTime" class="form-control" value="20" required />
            </div>
          </div>

          <div style="display:flex;flex-direction:column;gap:12px;margin:16px 0 24px;">
            <label style="display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:600;">
              <input type="checkbox" id="bizIsOpen" checked />
              <span>Salon is Currently OPEN for Live Queue & Bookings</span>
            </label>
            <label style="display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:600;">
              <input type="checkbox" id="bizHomeService" checked />
              <span>Enable Doorstep Home Beauty / Grooming Bookings</span>
            </label>
          </div>

          <button type="submit" class="btn btn-primary">Save Operational Settings</button>
        </form>
      </div>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/common.js"></script>
  <script src="js/owner.js"></script>
</body>
</html>
